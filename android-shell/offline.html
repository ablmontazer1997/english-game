<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Spell</title>
<style>
  html,body{margin:0;height:100%;background:#8a3fd1;color:#fff8e7;font:16px/1.5 system-ui,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  img{width:132px;height:132px;border-radius:30px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  h1{font-size:24px;margin:18px 0 6px}
  p{margin:0 0 22px;opacity:.9;max-width:300px}
  button{border:0;border-radius:16px;padding:14px 34px;font:700 17px system-ui,sans-serif;background:#f6c34a;color:#3b1a63}
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>The realm cannot be reached</h1>
  <p>English Spell needs the internet. Check your connection and try again.</p>
  <button id="retry">Try again</button>
</main>
<script>
  document.getElementById("retry").onclick = function () { location.href = "/runecast/index.html"; };
  window.addEventListener("online", function () { location.href = "/runecast/index.html"; });
</script>
</body>
</html>
