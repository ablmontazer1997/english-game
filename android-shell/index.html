<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Spell</title>
<style>html,body{margin:0;height:100%;background:#2b1166}</style>
<script>
  // Android app (admin 5935): every page is bundled in the APK under the same paths as on bingual.app
  // (/runecast/, /runecast-hero/, /runecast-wardrobe/). The local server answers any folder URL with this
  // file, so send it on to that folder's own index.html (query + hash kept: ?login=, ?embed=1, ...).
  (function () {
    var p = location.pathname;
    if (p === '/' || p === '/index.html') p = '/runecast/';
    if (p.charAt(p.length - 1) !== '/') p += '/';
    location.replace(p + 'index.html' + location.search + location.hash);
  })();
</script>
</head>
<body></body>
</html>
