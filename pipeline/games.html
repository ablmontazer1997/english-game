<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bingual Mini-Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--f:'Fredoka',system-ui,'Segoe UI',Roboto,sans-serif}
  html,body{height:100%}
  body{font-family:var(--f);background:#0e1230;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #app{position:relative;width:100%;max-width:440px;height:100%;max-height:940px;overflow:hidden;background:#000}
  @media(min-width:460px){#app{border-radius:34px;box-shadow:0 30px 80px rgba(0,0,0,.5);height:96vh}}

  /* tab bar */
  #tabs{position:absolute;z-index:40;left:50%;transform:translateX(-50%);bottom:10px;display:flex;gap:8px;
    background:rgba(255,255,255,.9);padding:6px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);backdrop-filter:blur(6px)}
  #tabs button{font-family:var(--f);font-weight:700;font-size:14px;border:0;padding:9px 16px;border-radius:999px;background:transparent;color:#5a5470}
  #tabs button.on{background:#2E2A63;color:#fff}
  .screen{position:absolute;inset:0;display:none}
  .screen.on{display:block}
  .ink{color:#2E2A63}

  /* ---------- MATCH BLITZ ---------- */
  #mb{background:linear-gradient(#EDEFFB,#F7F6FD)}
  #mb .top{display:flex;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 16px 4px;gap:12px;position:relative}
  #mb .back{width:46px;height:46px;border-radius:15px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 12px rgba(91,83,160,.18);font-size:22px;color:#6A46CC;font-weight:700}
  #mb .title{position:absolute;left:0;right:0;text-align:center;font-weight:700;font-size:26px;color:#2E2A63;pointer-events:none}
  #mb .rusty{position:absolute;top:-6px;right:-6px;width:110px;height:130px;object-fit:contain;pointer-events:none}
  .combo{height:104px;display:flex;align-items:center;justify-content:center;position:relative}
  .combo .burst{position:absolute;width:280px;height:104px;background:radial-gradient(ellipse at center,rgba(255,190,60,.55),rgba(255,190,60,0) 62%)}
  .combo .rays{position:absolute;width:230px;height:104px}
  .combo .txt{display:flex;align-items:baseline;gap:4px;z-index:2}
  .combo .c1{font-weight:700;font-size:40px;color:#fff;text-shadow:0 0 8px #E9820E,0 2px 0 #E9820E;letter-spacing:1px}
  .combo .c2{font-weight:700;font-size:44px;color:#FFC01E;text-shadow:0 2px 3px #8a4b00}
  .combo.bump{animation:bump .35s}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
  .tbar{margin:2px 14px 0;height:48px;border-radius:24px;background:#fff;position:relative;overflow:hidden;box-shadow:0 4px 10px rgba(91,83,160,.14);display:flex;align-items:center;justify-content:center}
  .tbar .fill{position:absolute;left:5px;top:5px;bottom:5px;border-radius:20px;background:linear-gradient(90deg,#16A79A,#45C86A,#EEC71F,#F39120);transition:width .3s linear}
  .tbar .tt{position:relative;font-weight:700;color:#fff;font-size:19px;text-shadow:0 1px 2px rgba(0,0,0,.25);z-index:2}
  #mb .board{position:relative;margin:16px 14px 0;flex:1}
  .row{position:relative;height:120px;margin-bottom:14px}
  /* all cards WHITE so color never hints the answer; focus stays on the words */
  .card{position:absolute;top:0;width:44%;height:120px;border-radius:22px;background:#fff;border:2px solid #E7E9F5;display:flex;align-items:center;justify-content:center;
    font-weight:700;color:#2E2A63;font-size:34px;cursor:pointer;box-shadow:0 6px 16px rgba(91,83,160,.16);transition:transform .12s,box-shadow .18s,border-color .18s,opacity .3s;overflow:hidden}
  .card.L{left:0}.card.R{right:0}
  .card.sel{transform:scale(1.04);border-color:#16A79A;box-shadow:0 0 0 3px rgba(22,167,154,.28),0 10px 24px rgba(22,167,154,.28)}
  .card.hot{transform:scale(1.06);border-color:#16A79A;box-shadow:0 0 0 4px rgba(22,167,154,.45),0 12px 28px rgba(22,167,154,.32)}
  .card.matched{border-color:#16A79A;background:#F3FCFA;color:#12897E}
  .card.wrong{animation:shk .4s;border-color:#E1483D}
  @keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  #app,.screen,#mb .board,.row,.card,#mbBoard{touch-action:none;-webkit-user-select:none;user-select:none}
  .mbfb{position:absolute;left:50%;top:46%;transform:translate(-50%,-6px);z-index:20;background:#fff;padding:8px 18px;border-radius:999px;font-weight:700;font-size:18px;box-shadow:0 8px 20px rgba(0,0,0,.18);opacity:0;transition:.2s;pointer-events:none}
  .mbfb.show{opacity:1;transform:translate(-50%,0)}
  .mbfb.ok{color:#16A79A}.mbfb.bad{color:#E1483D}
  #mb .lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:3}
  #mb .hint{position:absolute;left:14px;right:14px;bottom:74px;height:56px;background:#fff;border-radius:22px;display:flex;align-items:center;padding:0 16px;gap:12px;box-shadow:0 5px 12px rgba(91,83,160,.14)}
  #mb .hint .star{width:38px;height:38px;border-radius:19px;background:#EDE6FB;display:flex;align-items:center;justify-content:center;color:#F6B221;font-size:20px}
  #mb .hint .t{flex:1;font-weight:700;color:#2E2A63;font-size:17px}
  #mb .hint .pause{width:44px;height:44px;border-radius:22px;background:#16A79A;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}

  /* ---------- BUBBLE POP ---------- */
  #bp{overflow:hidden;background:#57b0ec}
  .bpbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #bp .sky{position:absolute;inset:0;background:linear-gradient(#2E93E6,#4FB0F0 55%,#8fd0f7)}
  #bp .cloud{position:absolute;background:#fff;border-radius:50%;filter:blur(2px);opacity:.9}
  #bp .bushes{position:absolute;left:0;right:0;bottom:0;height:150px}
  #bp .mini{position:absolute;border-radius:50%;background:radial-gradient(circle at 36% 30%,rgba(255,255,255,.9),rgba(205,238,255,.25) 68%,rgba(191,230,255,.08));border:1px solid rgba(255,255,255,.5);animation:drift linear infinite}
  @keyframes drift{0%{transform:translateY(0)}50%{transform:translateY(-14px)}100%{transform:translateY(0)}}
  #bp .title{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;text-align:center;font-weight:700;font-size:44px;filter:drop-shadow(0 0 5px #fff)}
  #bp .title .b{color:#19B0A6}#bp .title .p{color:#F2662A}
  #bp .qbar{position:absolute;top:calc(env(safe-area-inset-top) + 74px);left:12px;right:12px;background:#fff;border-radius:18px;padding:12px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 8px rgba(18,64,107,.18)}
  #bp .qbar .q{width:34px;height:34px;border-radius:11px;background:#1AA79C;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px}
  #bp .qbar .qt{flex:1;font-weight:600;color:#26356A;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #bp .qbar .qt b{font-weight:700}
  #bp .stat{position:absolute;top:calc(env(safe-area-inset-top) + 138px);left:14px;background:#fff;border-radius:16px;padding:8px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 6px rgba(18,64,107,.16);font-weight:700;color:#26356A}
  #bp .stat .s2{color:#2E9E6B;font-weight:600}#bp .stat .dv{width:1px;height:18px;background:#d9dced}
  #bp .ring{position:absolute;top:calc(env(safe-area-inset-top) + 130px);right:16px;width:66px;height:66px}
  #bp .ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  #bp .ring .v b{font-size:20px;color:#26356A;line-height:1}#bp .ring .v s{font-size:10px;color:#7C88A8;text-decoration:none}
  .bub{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.18);cursor:pointer;
    border:2px solid rgba(255,255,255,.5);animation:bob ease-in-out infinite;transition:transform .12s}
  .bub:after{content:"";position:absolute;top:14%;left:20%;width:34%;height:24%;border-radius:50%;background:rgba(255,255,255,.7);filter:blur(1px)}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  /* the big bubble vanishes fast under the droplet cloud, so it reads as breaking INTO droplets */
  .bub.pop{animation:pop .09s ease-in forwards;pointer-events:none}
  @keyframes pop{0%{transform:scale(1);opacity:1}100%{transform:scale(.5);opacity:0}}
  .bub.miss{animation:shk .4s}
  .bub .w{position:relative;z-index:2}
  .b-blue{background:radial-gradient(circle at 36% 30%,#CDEBFF,#5AA9EA 58%,#2F7FCB)}
  .b-purple{background:radial-gradient(circle at 36% 30%,#E0D2FA,#9575E2 58%,#6E4FC9)}
  .b-green{background:radial-gradient(circle at 36% 30%,#CFEFA8,#5FBE38 58%,#3E9A22)}
  .b-gold{background:radial-gradient(circle at 36% 30%,#FFEEA6,#F5C023 58%,#E09A0C)}
  #bpField{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 198px);bottom:66px}
  #bp .fb{position:absolute;left:50%;bottom:88px;transform:translate(-50%,10px);background:#fff;border-radius:18px;padding:10px 20px;box-shadow:0 6px 18px rgba(18,64,107,.22);opacity:0;transition:.25s;text-align:center;z-index:24;pointer-events:none}
  #bp .fb.show{opacity:1;transform:translate(-50%,0)}
  #bp .fb .c{font-weight:700;color:#2FA36A;font-size:20px}#bp .fb .c.bad{color:#E1483D}
  #bp .fb .s{font-weight:600;color:#26356A;font-size:14px}
  .drop{position:absolute;border-radius:50%;pointer-events:none;z-index:23;box-shadow:0 0 4px rgba(255,255,255,.65),inset 0 0 3px rgba(255,255,255,.7)}
  .rimsnap{position:absolute;border-radius:50%;pointer-events:none;z-index:22;border:4px solid #fff;box-shadow:0 0 14px rgba(255,255,255,.75)}
  .shard{position:absolute;pointer-events:none;z-index:23;border-radius:3px;box-shadow:0 0 4px rgba(255,255,255,.55)}
  .mist{position:absolute;border-radius:50%;pointer-events:none;z-index:20;background:radial-gradient(circle,rgba(255,255,255,.6),rgba(255,255,255,0) 68%)}

  /* game over */
  .over{position:absolute;inset:0;z-index:30;background:rgba(20,18,45,.66);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;backdrop-filter:blur(3px)}
  .over.on{display:flex}
  .over h2{color:#fff;font-size:30px;font-weight:700}
  .over p{color:#dfe0f0;font-size:17px}
  .over button{font-family:var(--f);font-weight:700;font-size:18px;border:0;padding:13px 30px;border-radius:999px;background:#fff;color:#2E2A63;box-shadow:0 8px 20px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div id="app">

  <!-- ===== MATCH BLITZ ===== -->
  <section id="mb" class="screen">
    <div class="top">
      <div class="back">&#8592;</div>
      <div class="title">Match Blitz</div>
    </div>
    <div class="combo" id="mbCombo">
      <div class="burst"></div>
      <svg class="rays" viewBox="0 0 230 104" id="mbRays"></svg>
      <div class="txt"><span class="c1">COMBO</span><span class="c2" id="mbComboN">x1</span></div>
    </div>
    <div class="tbar"><div class="fill" id="mbFill" style="width:72%"></div><div class="tt" id="mbTime">0:30</div></div>
    <div class="board" id="mbBoard">
      <svg class="lines" id="mbLines"></svg>
    </div>
    <div class="mbfb" id="mbFb"></div>
    <div class="over" id="mbOver"><h2 id="mbOverT">Time!</h2><p id="mbOverP"></p><button onclick="MB.start()">Play again</button></div>
  </section>

  <!-- ===== BUBBLE POP ===== -->

<script>
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
  document.getElementById('tabMb').classList.toggle('on',id==='mb');
  document.getElementById('tabBp').classList.toggle('on',id==='bp');
  if(id==='mb') MB.start(); else BP.start();
}
// combo rays for MB
(function(){const s=document.getElementById('mbRays');let h='';for(let i=0;i<16;i++){const a=i*22.5*Math.PI/180,cx=115,cy=52;
  const r1=44+(i%2)*8,r2=78+(i%3)*14;h+=`<line x1="${cx+Math.cos(a)*r1}" y1="${cy+Math.sin(a)*r1*0.62}" x2="${cx+Math.cos(a)*r2}" y2="${cy+Math.sin(a)*r2*0.62}" stroke="#FFC848" stroke-width="3" stroke-linecap="round" opacity=".55"/>`;}
  s.innerHTML=h;})();

/* ============ MATCH BLITZ ============ */
var MB=(function(){
  const POOL=[['I','am'],['She','is'],['They','are'],['We','were'],['He','was'],['You','have'],['It','has']];
  const ACCENT='#16A79A', ACCENT_GLOW='rgba(22,167,154,.32)';
  const ns='http://www.w3.org/2000/svg';
  const board=document.getElementById('mbBoard'), lines=document.getElementById('mbLines');
  const comboN=document.getElementById('mbComboN'), comboEl=document.getElementById('mbCombo');
  const fill=document.getElementById('mbFill'), timeEl=document.getElementById('mbTime'), over=document.getElementById('mbOver');
  const fbEl=document.getElementById('mbFb');
  let pairs,rightOrder,combo,matched,timer,timeLeft,running,drag;
  function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function start(){ over.classList.remove('on'); combo=0;timeLeft=30;running=true;drag=null; comboN.textContent='x1';
    newBoard(); clearInterval(timer); timer=setInterval(tick,1000); tick(0); }
  function newBoard(){ pairs=shuffle(POOL).slice(0,4); rightOrder=shuffle(pairs.map((p,i)=>i)); matched=0; render(); }
  function tick(dec){ if(dec!==0){timeLeft--;} if(timeLeft<0){return end(false);}
    fill.style.width=Math.min(100,timeLeft/30*100)+'%'; timeEl.textContent='0:'+String(Math.max(0,timeLeft)).padStart(2,'0'); }
  function render(){
    board.querySelectorAll('.row').forEach(r=>r.remove()); lines.innerHTML='';
    // all cards white -> word/verb is the only cue
    pairs.forEach((p,i)=>{ const row=document.createElement('div');row.className='row';
      const L=document.createElement('div');L.className='card L';L.textContent=p[0];L.dataset.pid=i;L.dataset.side='L';
      row.appendChild(L);board.appendChild(row); });
    const rows=board.querySelectorAll('.row');
    rightOrder.forEach((pid,slot)=>{ const row=rows[slot];
      const R=document.createElement('div');R.className='card R';R.textContent=pairs[pid][1];R.dataset.pid=pid;R.dataset.side='R';
      row.appendChild(R); });
    board.querySelectorAll('.card').forEach(c=>c.addEventListener('pointerdown',onDown));
  }
  function nodeOf(card){ const b=board.getBoundingClientRect(),r=card.getBoundingClientRect();
    return {x:(card.dataset.side==='L'?r.right:r.left)-b.left, y:r.top-b.top+r.height/2}; }
  function hitCard(e){ const el=document.elementFromPoint(e.clientX,e.clientY); return el&&el.closest?el.closest('.card'):null; }
  function onDown(e){ const card=e.currentTarget;
    if(!running||card.classList.contains('matched'))return; e.preventDefault();
    const n=nodeOf(card); card.classList.add('sel');
    const live=document.createElementNS(ns,'path');
    live.setAttribute('stroke',ACCENT);live.setAttribute('stroke-width','6');live.setAttribute('fill','none');live.setAttribute('stroke-linecap','round');live.setAttribute('opacity','.95');
    live.style.filter='drop-shadow(0 0 5px '+ACCENT_GLOW+')';
    lines.appendChild(live);
    drag={card,side:card.dataset.side,pid:card.dataset.pid,sx:n.x,sy:n.y,live,hot:null};
    let captured=false; try{card.setPointerCapture(e.pointerId);captured=true;}catch(_){}
    if(captured){ card.addEventListener('pointermove',onMove); card.addEventListener('pointerup',onUp,{once:true}); card.addEventListener('pointercancel',onUp,{once:true}); }
    else { window.addEventListener('pointermove',onMove); window.addEventListener('pointerup',onUp,{once:true}); window.addEventListener('pointercancel',onUp,{once:true}); }
    drag.captured=captured;
  }
  function onMove(e){ if(!drag)return; e.preventDefault(); const b=board.getBoundingClientRect();
    const x=e.clientX-b.left,y=e.clientY-b.top,mx=(drag.sx+x)/2;
    drag.live.setAttribute('d',`M${drag.sx},${drag.sy} C${mx},${drag.sy} ${mx},${y} ${x},${y}`);
    const t=hitCard(e), valid=t&&t!==drag.card&&!t.classList.contains('matched')&&t.dataset.side!==drag.side;
    if(drag.hot&&drag.hot!==t){drag.hot.classList.remove('hot');drag.hot=null;}
    if(valid){t.classList.add('hot');drag.hot=t;} }
  function onUp(e){ const d=drag; drag=null; if(!d)return;
    if(d.captured) d.card.removeEventListener('pointermove',onMove); else window.removeEventListener('pointermove',onMove);
    d.card.classList.remove('sel'); if(d.hot)d.hot.classList.remove('hot'); if(d.live)d.live.remove();
    const tgt=hitCard(e);
    if(!tgt||tgt===d.card||tgt.classList.contains('matched')||tgt.dataset.side===d.side)return;
    if(tgt.dataset.pid===d.pid){
      d.card.classList.add('matched');tgt.classList.add('matched');
      combo++;comboN.textContent='x'+combo;bump();feedback(true);
      const L=d.side==='L'?d.card:tgt, R=d.side==='L'?tgt:d.card;
      drawPair(+d.pid,R,L,true); matched++;
      if(matched===pairs.length){ timeLeft=Math.min(35,timeLeft+6); feedback(true,'Cleared! +6s'); setTimeout(()=>{if(running)newBoard();},750); }
    } else {
      d.card.classList.add('wrong');tgt.classList.add('wrong');
      setTimeout(()=>{d.card.classList.remove('wrong');tgt.classList.remove('wrong');},430);
      combo=0;comboN.textContent='x1';feedback(false);
    }
  }
  function feedback(ok,msg){ fbEl.textContent=msg||(ok?'Nice!':'Try again'); fbEl.className='mbfb show '+(ok?'ok':'bad');
    clearTimeout(fbEl._t); fbEl._t=setTimeout(()=>{fbEl.className='mbfb';},950); }
  function bump(){comboEl.classList.remove('bump');void comboEl.offsetWidth;comboEl.classList.add('bump');}
  function draw(){ lines.innerHTML='';
    board.querySelectorAll('.card.L.matched').forEach(L=>{ const R=[...board.querySelectorAll('.card.R.matched')].find(r=>r.dataset.pid===L.dataset.pid); if(R)drawPair(+L.dataset.pid,R,L,false); }); }
  function drawPair(pid,R,L,anim){
    const b=board.getBoundingClientRect(),a=L.getBoundingClientRect(),c=R.getBoundingClientRect();
    const x1=a.right-b.left,y1=a.top-b.top+a.height/2,x2=c.left-b.left,y2=c.top-b.top+c.height/2;
    const col=ACCENT;
    const d=`M${x1},${y1} C${x1+24},${y1-16} ${x2-24},${y2+16} ${x2},${y2}`;
    function mk(w,cc,o){const p=document.createElementNS(ns,'path');p.setAttribute('d',d);p.setAttribute('stroke',cc);p.setAttribute('stroke-width',w);p.setAttribute('fill','none');p.setAttribute('stroke-linecap','round');if(o)p.setAttribute('opacity',o);return p;}
    const g=mk(12,ACCENT_GLOW),br=mk(4.5,col);lines.appendChild(g);lines.appendChild(br);
    [[x1,y1],[x2,y2]].forEach(([x,y])=>{const c1=document.createElementNS(ns,'circle');c1.setAttribute('cx',x);c1.setAttribute('cy',y);c1.setAttribute('r',7);c1.setAttribute('fill','#fff');c1.setAttribute('stroke',col);c1.setAttribute('stroke-width','3');lines.appendChild(c1);});
    if(anim){const len=br.getTotalLength();[g,br].forEach(p=>{p.style.strokeDasharray=len;p.style.strokeDashoffset=len;p.getBoundingClientRect();p.style.transition='stroke-dashoffset .35s ease';p.style.strokeDashoffset=0;});}
  }
  function end(win){running=false;clearInterval(timer);
    document.getElementById('mbOverT').textContent=win?'Cleared!':'Time!';
    document.getElementById('mbOverP').textContent='Best combo x'+Math.max(1,combo);
    over.classList.add('on');}
  window.addEventListener('resize',()=>{if(running)draw();});
  return {start};
})();

/* ============ BUBBLE POP ============ */
var BP=(function(){
  const QS=[
    {q:'She ___ to school',opts:['go','going','goes','gone'],a:'goes'},
    {q:'I ___ a student',opts:['is','am','are','be'],a:'am'},
    {q:'He ___ coffee every day',opts:['drink','drinks','drinking','drank'],a:'drinks'},
    {q:'They ___ very happy',opts:['is','am','are','be'],a:'are'},
    {q:'We ___ TV last night',opts:['watch','watches','watching','watched'],a:'watched'},
    {q:'She has ___ home',opts:['go','goes','going','gone'],a:'gone'},
  ];
  const COLS=['b-blue','b-purple','b-green','b-gold'];
  const field=document.getElementById('bpField'), qEl=document.getElementById('bpQ');
  const scoreEl=document.getElementById('bpScore'), progEl=document.getElementById('bpProg');
  const ring=document.getElementById('bpRingArc'), secEl=document.getElementById('bpSec');
  const fb=document.getElementById('bpFb'),fbc=document.getElementById('bpFbc'),fbs=document.getElementById('bpFbs');
  const over=document.getElementById('bpOver');
  const RC=175.9;
  let idx,score,combo,timeLeft,timer,running,locked;
  function build(){}  /* background is now a real illustration image */
  function start(){build();over.classList.remove('on');idx=0;score=0;combo=0;running=true;scoreEl.textContent='0';load();}
  function load(){
    locked=false; const Q=QS[idx];
    qEl.innerHTML='Tap the correct form: <b>'+Q.q+'</b>';
    progEl.textContent=(idx+1)+'/'+QS.length;
    field.innerHTML='';
    const W=field.clientWidth||420,H=field.clientHeight||600;
    const slots=[[0.30,0.22,120],[0.72,0.34,128],[0.26,0.60,116],[0.70,0.72,122]];
    const jit=()=>Math.round((Math.random()*2-1)*12);
    Q.opts.forEach((w,i)=>{
      const [fx,fy,sz]=slots[i];
      const b=document.createElement('div');b.className='bub '+COLS[i%4];
      b.style.cssText=`left:${fx*W-sz/2+jit()}px;top:${fy*H-sz/2+jit()}px;width:${sz}px;height:${sz}px;font-size:${w.length>4?sz*0.24:sz*0.3}px;animation-duration:${2.6+i*0.4}s`;
      b.innerHTML='<span class="w">'+w+'</span>';
      b.onclick=()=>pick(b,w,Q.a);
      field.appendChild(b);
    });
    timeLeft=15; secEl.textContent='15'; ring.style.strokeDashoffset='0';
    clearInterval(timer); timer=setInterval(()=>{
      timeLeft--; if(timeLeft<0){clearInterval(timer);return miss(null);}
      secEl.textContent=timeLeft; ring.style.strokeDashoffset=RC*(1-timeLeft/15);
    },1000);
  }
  const CMAP={'b-blue':'#7fc9f5','b-purple':'#b99cf0','b-green':'#87d95f','b-gold':'#ffd24d'};
  function pick(b,w,ans){
    if(b.dataset.gone)return;
    let col='#bfe6ff'; for(const k in CMAP) if(b.classList.contains(k)) col=CMAP[k];
    const r=b.getBoundingClientRect(),f=field.getBoundingClientRect();
    burst(r.left-f.left+r.width/2,r.top-f.top+r.height/2,col,r.width/2);   // every tapped bubble really bursts
    b.dataset.gone='1'; b.style.pointerEvents='none';
    b.style.animation='none';   // kill the float loop (its inline duration would otherwise slow the hide)
    b.animate([{opacity:1,transform:'scale(1)'},{opacity:.6,transform:'scale(.8)',offset:.5},{opacity:0,transform:'scale(.4)'}],
              {duration:150,easing:'ease-out',fill:'forwards'}).onfinish=()=>{b.style.visibility='hidden';};
    if(w===ans){ locked=true;clearInterval(timer);
      combo++; score+=10+combo*2; scoreEl.textContent=score; showFb(true);
      idx++; if(idx>=QS.length){ setTimeout(()=>end(),750); } else setTimeout(load,820);
    } else { combo=0; showFb(false); }   // wrong bubble still pops, then vanishes; keep trying
  }
  function miss(b){ combo=0; showFb(false); locked=true; setTimeout(()=>{ idx++; if(idx>=QS.length)end(); else load(); },700); }
  function showFb(ok){ fbc.textContent=ok?'Correct!':'Try again!'; fbc.className='c'+(ok?'':' bad'); fbs.textContent=ok?'Way to go!':'Give it another shot'; fb.classList.add('show'); clearTimeout(fb._t); fb._t=setTimeout(()=>fb.classList.remove('show'),1200); }
  let AC=null;
  function playPop(){
    try{
      if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
      if(AC.state==='suspended') AC.resume();
      const t=AC.currentTime;
      // body: a very short low "thump" = the pressure release
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.setValueAtTime(int(380,460),t);o.frequency.exponentialRampToValueAtTime(85,t+0.045);
      g.gain.setValueAtTime(0.34,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
      o.connect(g).connect(AC.destination);o.start(t);o.stop(t+0.1);
      // transient: bright, ultra-short noise tick = the film actually snapping
      const len=Math.floor(AC.sampleRate*0.03),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
      const n=AC.createBufferSource();n.buffer=buf;
      const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=1700;
      const ng=AC.createGain();ng.gain.setValueAtTime(0.5,t);ng.gain.exponentialRampToValueAtTime(0.001,t+0.04);
      n.connect(hp).connect(ng).connect(AC.destination);n.start(t);
    }catch(e){}
  }
  function int(a,b){return a+Math.random()*(b-a);}
  // The BIG bubble itself shatters into many tiny droplets: they briefly still form the
  // bubble's shape, then scatter outward (with gravity) and shrink away until it is all gone.
  function burst(x,y,col,r){
    playPop();
    col=col||'#bfe6ff'; r=r||55;
    // droplet cloud that fills the whole bubble disk, then explodes outward
    const N=Math.min(52,Math.max(30,Math.round(r*0.95)));
    for(let i=0;i<N;i++){
      const a=Math.random()*Math.PI*2;
      const rr=r*Math.sqrt(Math.random());                 // uniform point INSIDE the bubble
      const sx=Math.cos(a)*rr, sy=Math.sin(a)*rr;           // where that piece of the bubble sat
      // fling along its own ray (+ jitter) so droplets spray to EVERY side; gravity is gentle so up/side travel shows
      const ja=a+(Math.random()-0.5)*0.7;
      const out=r*(1.5+Math.random()*2.2);
      const gx=Math.cos(ja)*out, gy=Math.sin(ja)*out+(45+Math.random()*95);
      const sz=4+Math.random()*6+(1-rr/r)*5;                // a touch bigger toward the centre
      const p=document.createElement('div');p.className='drop';
      p.style.cssText=`left:${x+sx}px;top:${y+sy}px;width:${sz}px;height:${sz}px;background:radial-gradient(circle at 34% 30%,#ffffff,${col} 60%,rgba(0,40,80,.22) 100%)`;
      field.appendChild(p);
      p.animate([
        {transform:'translate(-50%,-50%) scale(1)',opacity:1,offset:0},
        {transform:'translate(-50%,-50%) scale(1)',opacity:1,offset:.07},   // still whole for a smooth instant
        {transform:`translate(-50%,-50%) translate(${gx*0.6}px,${gy*0.5}px) scale(.85)`,opacity:1,offset:.55},
        {transform:`translate(-50%,-50%) translate(${gx}px,${gy}px) scale(.3)`,opacity:0,offset:1}
      ],{duration:680+Math.random()*560,easing:'cubic-bezier(.12,.62,.24,1)'}).onfinish=()=>p.remove();
    }
    // a quick edge flash so the burst registers the instant it is tapped
    const rim=document.createElement('div');rim.className='rimsnap';
    rim.style.cssText=`left:${x}px;top:${y}px;width:${r*2}px;height:${r*2}px;border-color:${col}`;
    field.appendChild(rim);
    rim.animate([{transform:'translate(-50%,-50%) scale(.9)',opacity:.85,borderWidth:'5px'},
                 {transform:'translate(-50%,-50%) scale(1.4)',opacity:0,borderWidth:'1px'}],
                {duration:200,easing:'ease-out'}).onfinish=()=>rim.remove();
  }
  function end(){running=false;clearInterval(timer);
    document.getElementById('bpOverT').textContent='Round complete!';
    document.getElementById('bpOverP').textContent='Score '+score;
    over.classList.add('on');}
  return {start};
})();

BP.start();
</script>
</body>
