# English Spell API (internal name: runecast). Uses the EXISTING Postgres server (bingual-backend-db-1) with its own
# database + role `runecast` (admin msg 3055: no second Postgres container). It joins Bingual's compose network only to
# reach that server; it does not change any Bingual container.
name: runecast
services:
  runecast-api:
    build: .
    image: runecast-api:latest
    container_name: runecast-api
    restart: unless-stopped
    env_file: .env
    environment:
      RUNECAST_DB_HOST: bingual-backend-db-1
      RUNECAST_DB_NAME: runecast
      RUNECAST_DB_USER: runecast
      RUNECAST_ROOT_PATH: /runecast-api
      RUNECAST_QDB_DIR: /qdb
      RUNECAST_DB_POOL_SIZE: "3"
      RUNECAST_DB_MAX_OVERFLOW: "2"
    volumes:
      - /home/rade/projects/keyumars/runecast_qdb/db:/qdb:ro
    ports:
      - "172.20.0.1:8110:8000"   # same pattern as bingual-backend-api (8001); Caddy reaches it on the bridge IP
    networks: [bingualdb]
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  bingualdb:
    external: true
    name: bingual-backend_default
