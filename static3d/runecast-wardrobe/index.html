<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Runecast Wardrobe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* ---- soft Runecast look: cream card, lavender/violet accents, gold highlights (light theme only, like the game's soft screens) */
:root{--bg1:#f7f0ff;--bg2:#ffeee9;--ink:#2a2550;--ink2:#6b7192;--cream:#fffdf6;--cream2:#fbf5ea;--line:#efe4cf;
  --vio:#8a4fd8;--vio2:#6f3fd0;--vioSoft:#f1e9ff;--vioInk:#5a2fb0;--gold:#f5c451;--goldDeep:#c8963a;
  --sheetH:clamp(330px,46vh,480px);--font:'Nunito',system-ui,-apple-system,sans-serif;--game:'Baloo 2','Nunito',sans-serif}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 50% 30%,var(--bg1),var(--bg2))}
#c{position:fixed;left:0;right:0;top:0;bottom:0}
#ld{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--ink2)}
html.editor #c,html.editor #ld{bottom:calc(var(--sheetH) - 14px)}
html.embed #ed,html.embed #edTop,html.embed #ld{display:none!important}html.embed body{background:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
/* top bar over the stage */
#edTop{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:max(12px,env(safe-area-inset-top)) 16px 0;pointer-events:none;z-index:3}
#edTop>*{pointer-events:auto}
.ttl{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;background:rgba(255,253,246,.82);
  box-shadow:0 4px 14px rgba(90,47,176,.12);border:1px solid rgba(239,228,207,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ttl i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:linear-gradient(145deg,#a978ff,var(--vio2));color:#fff}
.ttl b{font-family:var(--game);font-weight:800;font-size:18px;letter-spacing:.2px;line-height:1;color:var(--ink);padding-top:2px}
.acts{display:flex;gap:8px}
.ib{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 10px;border-radius:999px;border:1px solid rgba(239,228,207,.95);
  background:rgba(255,253,246,.9);color:var(--vioInk);font-weight:800;font-size:13px;box-shadow:0 4px 14px rgba(90,47,176,.12);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .15s}
.ib:active{transform:scale(.94)}
.ib.gold{background:linear-gradient(180deg,#fff6d8,#ffe7a6);border-color:#f0cf7a;color:#7a4b00}
.ib svg{width:20px;height:20px}
/* bottom sheet */
#ed{position:fixed;left:0;right:0;bottom:0;height:var(--sheetH);z-index:2;display:flex;flex-direction:column;
  background:var(--cream);border-radius:26px 26px 0 0;box-shadow:0 -12px 34px rgba(90,47,176,.14),0 -1px 0 #f3e6c8;overflow:hidden}
#ed::before{content:"";position:absolute;left:50%;top:7px;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:#e8dcc4}
#tabs{display:flex;gap:2px;overflow-x:auto;padding:16px 10px 6px;scrollbar-width:none;flex:0 0 auto;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 18px),transparent)}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;width:58px;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:2px 0;color:var(--ink2)}
.tab i{display:grid;place-items:center;width:42px;height:42px;border-radius:15px;background:var(--vioSoft);color:#7a62b0;transition:all .18s}
.tab svg{width:22px;height:22px}
.tab span{font-size:11.5px;font-weight:800;letter-spacing:.1px}
.tab.on i{background:linear-gradient(150deg,#a978ff,var(--vio2));color:#fff;box-shadow:0 5px 12px rgba(111,63,208,.35),inset 0 0 0 2px rgba(245,196,81,.55)}
.tab.on span{color:var(--vioInk)}
.rule{height:1px;margin:4px 16px 0;background:linear-gradient(90deg,transparent,#ecd9a8,transparent);flex:0 0 auto}
#pane{flex:1 1 auto;overflow-y:auto;padding:10px 16px 12px;scrollbar-width:thin;overscroll-behavior:contain}
html.inapp #pane{padding-bottom:64px} /* the app's floating Done button sits over the sheet's lower right */
.sec+.sec{margin-top:14px}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 8px}
.sh h3{margin:0;font-family:var(--game);font-weight:800;font-size:16px;line-height:1.1;color:var(--ink)}
.sh small{font-size:12px;font-weight:700;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px 10px}
.card{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:5px;border:0;background:none;padding:0;min-width:0}
.card .th{position:relative;aspect-ratio:1;border-radius:16px;background:radial-gradient(circle at 50% 40%,#fff 0,#f6f0ff 70%,#efe6fb 100%);
  border:1.5px solid #eee4f7;box-shadow:0 2px 6px rgba(60,40,120,.07);overflow:hidden;transition:box-shadow .15s,border-color .15s,transform .15s}
.card:active .th{transform:scale(.95)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.card img.ok{opacity:1}
.card .ic{position:absolute;inset:0;display:grid;place-items:center;color:#b7a6d8}
.card .ic svg{width:44%;height:44%}
.card img.ok+.ic{display:none}
.card .lb{font-size:12px;font-weight:800;text-align:center;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.on .th{border-color:var(--vio);box-shadow:0 0 0 2px var(--vio),0 6px 14px rgba(111,63,208,.25)}
.card.on .lb{color:var(--vioInk)}
.card .ck{position:absolute;right:-5px;top:-5px;width:22px;height:22px;border-radius:50%;display:none;place-items:center;
  background:linear-gradient(150deg,#a978ff,var(--vio2));color:#fff;border:2px solid #ffe7a6;box-shadow:0 2px 6px rgba(111,63,208,.35);z-index:1}
.card .ck svg{width:12px;height:12px}
.card.on .ck{display:grid}
.card.none .th{background:repeating-linear-gradient(45deg,#fbf7ff 0 8px,#f6f0ff 8px 16px)}
.sld{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;background:var(--cream2);border:1px solid var(--line)}
.sld span{font-size:13px;font-weight:800;color:var(--ink2);min-width:44px}
.sld input{flex:1;accent-color:var(--vio)}
/* colour strip under the grid */
#strip{flex:0 0 auto;border-top:1px solid var(--line);background:linear-gradient(180deg,#fffaf0,var(--cream2));padding:8px 0 max(10px,env(safe-area-inset-bottom))}
#strip[hidden],#ed[hidden],#edTop[hidden]{display:none}
#strip .sh{margin:0 18px 6px;justify-content:flex-start;gap:8px}
#strip .sh small::before{content:"· "}#strip .sh small:empty{display:none}
.sws{display:flex;gap:10px;overflow-x:auto;padding:4px 18px 4px;scrollbar-width:none}
.sws::-webkit-scrollbar{display:none}
.sw{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:3px solid #fff;padding:0;box-shadow:0 2px 6px rgba(60,40,120,.18);position:relative;transition:transform .15s}
.sw:active{transform:scale(.9)}
.sw.on{box-shadow:0 0 0 2.5px var(--vio),0 4px 10px rgba(111,63,208,.3)}
.sw.orig{background:conic-gradient(from 45deg,#f5c451,#e07aa3,#8a4fd8,#2f8fd8,#1f9a63,#f5c451)}
.sw.orig::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--o,#fff);border:1.5px solid #fff}
.sw:disabled{opacity:.35;cursor:default}
.hint{font-size:12px;font-weight:700;color:var(--ink2);padding:4px 18px 6px}
/* ---- boots-tabs (09-30): phones: all 9 tabs fit the bar (Pants/Shoes/Pose were off-screen with no scroll hint) */
@media (max-width:560px){#tabs{gap:0;padding:16px 4px 6px;-webkit-mask-image:none;mask-image:none}
  .tab{flex:1 1 0;width:auto;min-width:0}.tab i{width:min(42px,9.4vw);height:min(42px,9.4vw);border-radius:13px}
  .tab svg{width:20px;height:20px}.tab span{font-size:min(11.5px,2.9vw);letter-spacing:0}}
/* ---- /boots-tabs */
/* wide screens: the sheet becomes a side panel */
@media (min-width:820px) and (min-aspect-ratio:1/1){
  #ed{left:auto;right:18px;top:18px;bottom:18px;height:auto;width:400px;border-radius:26px}
  html.editor #c,html.editor #ld{bottom:0;right:436px}
  #edTop{right:436px}
}

<header id="edTop"><div class="ttl"><i></i><b>Wardrobe</b></div><div class="acts">

<section id="ed" aria-label="Character editor"><nav id="tabs" role="tablist"></nav><div class="rule"></div>
  <div id="pane" role="tabpanel"></div><div id="strip" hidden></div></section>

<script>
const CEL=document.getElementById('c');const W=()=>CEL.clientWidth||innerWidth,H=()=>CEL.clientHeight||innerHeight;
const r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(W(),H());
r.outputEncoding=THREE.sRGBEncoding;document.getElementById('c').appendChild(r.domElement);
const sc=new THREE.Scene();
// soft studio reflections for the vinyl look
try{const pm=new THREE.PMREMGenerator(r);sc.environment=pm.fromScene(new THREE.RoomEnvironment(),0.04).texture;}catch(e){}
// LOOK: 'studio' = warm key light with soft shadows, cool fill, pink rim, ACES tone mapping, ground contact shadow
//       'flat'   = the old even lighting (?look=flat)
const LOOK=new URLSearchParams(location.search).get('look')||'studio';const STUDIO=LOOK!=='flat';
if(!STUDIO){sc.add(new THREE.HemisphereLight(0xffffff,0x8a7a90,0.6));
const d=new THREE.DirectionalLight(0xffffff,0.9);d.position.set(1.2,2,2);sc.add(d);
const d2=new THREE.DirectionalLight(0xffffff,0.5);d2.position.set(-1.5,1.5,-2);sc.add(d2);}
else{const TM=new URLSearchParams(location.search).get('tm');if(TM==='aces'){r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=+(new URLSearchParams(location.search).get('exp')||0.85);}
 r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
 sc.add(new THREE.HemisphereLight(0xfff4ee,0x7a6a92,0.55));
 const key=new THREE.DirectionalLight(0xffe8d2,1.05);key.position.set(2.6,3.0,0.6);key.castShadow=true;
 key.shadow.mapSize.set(2048,2048);const sc2=key.shadow.camera;sc2.left=-0.8;sc2.right=0.8;sc2.top=0.8;sc2.bottom=-0.8;sc2.near=0.5;sc2.far=8;
 key.shadow.bias=-0.0004;key.shadow.normalBias=0.012;key.shadow.radius=4;sc.add(key);
 const fill=new THREE.DirectionalLight(0xc8d6ff,0.35);fill.position.set(0.8,1.0,-2.2);sc.add(fill);
 const rim=new THREE.DirectionalLight(0xffd4f0,0.8);rim.position.set(-2.4,2.0,0.6);sc.add(rim);
 const rim2=new THREE.DirectionalLight(0xd8e4ff,0.45);rim2.position.set(-2.0,1.5,-1.4);sc.add(rim2);}
const cam=new THREE.PerspectiveCamera(30,W()/H(),0.05,50);
const ctl=new THREE.OrbitControls(cam,r.domElement);ctl.enableDamping=true;ctl.enablePan=false;
const onStageResize=()=>{cam.aspect=W()/H();cam.updateProjectionMatrix();r.setSize(W(),H());window.dispatchEvent(new Event('rc-stage'));};
addEventListener('resize',onStageResize);if(window.ResizeObserver)new ResizeObserver(onStageResize).observe(CEL);
function SkirtSpring(root){
  // coat skirt springs (v2, 10-01 "the pants must never come through the cloak"):
  //  - each chain's hem point (tail) is measured from the worn coat itself (the skeleton's tip bones point at the centre line,
  //    so the old solver collided a point between the legs and never the real hem);
  //  - the legs are bone-attached proxies fitted to the worn trousers: thigh and calf, radius per (3 stations x 12 directions
  //    around the bone), so wide hips or a puffy knee are matched without over-inflating the other sides; plus a cloth margin;
  //  - the skirt collides through ~170 real coat vertices spread over it (with their own spring bones and weights), corrected
  //    for the 0.8
  //    spring weight of the cloth, and always pushed to the outer side of the leg (a leg that jumped through is not trapped);
  //  - the simulation rides with the character (root moves/turns, the walk clip's hip snap at its loop restart) and is
  //    re-seeded (rest pose + collision pre-solve) when the legs jump (frozen thumbnail poses, clip jumps);
  //  - the swing angle per segment is limited, so the cloth can never flip.
  const V=THREE.Vector3,Q=THREE.Quaternion,M4=THREE.Matrix4;const by={};root.traverse(o=>{by[o.name]=o;});
  const chains=[];for(let k=0;by['skirt_'+k+'_0'];k++)chains.push({b:[0,1,2].map(s=>by['skirt_'+k+'_'+s])});
  if(!chains.length)return null;
  const N=chains.length,pel=by.Pelvis;
  const LEGS=[['L_Thigh','L_Calf',0.058],['L_Calf','L_Foot',0.046],['R_Thigh','R_Calf',0.058],['R_Calf','R_Foot',0.046]].filter(l=>by[l[0]]&&by[l[1]]);
  const BARE=1.12,MARGIN=0.008,NS=12,NT=3;   // bare-leg radius factor (no trousers) / cloth clearance / directions / stations
  const caps=LEGS.map(l=>({a:new V(),b:new V(),q:new Q(),u:new V(),e1:new V(),e2:new V(),r:new Float32Array(NS*NT).fill(l[2]*BARE),r0:l[2]}));
  const P=(o,t)=>o.getWorldPosition(t||new V());
  const W0=0.8;
  chains.forEach(ch=>{ch.x=[null,new V(),new V()];ch.px=[null,new V(),new V()];ch.t=[null,new V(),new V()];ch.o=new V();
    ch.tail=ch.b[2].position.clone();ch.w=[W0,W0,W0];ch.L=[0,0,0];ch.rq=new Q();ch.L2s=1;});
  const tq=new Q(),pq=new Q(),wq=new Q(),a=new V(),b=new V(),c=new V(),d=new V(),e=new V();
  const restBones=()=>{for(const ch of chains){ch.b[0].quaternion.set(0,0,0,1);ch.b[1].quaternion.set(0,0,0,1);}};
  const targets=()=>{for(const sp of samples)sp.rest.copy(sp.loc).applyMatrix4(sp.b.matrixWorld);for(const ch of chains){ch.b[0].updateMatrixWorld(true);P(ch.b[0],ch.o);P(ch.b[1],ch.t[1]);ch.t[2].copy(ch.tail).applyMatrix4(ch.b[1].matrixWorld);
    ch.L[1]=ch.t[1].distanceTo(ch.o);ch.L[2]=ch.t[2].distanceTo(ch.t[1]);}};
  function aim(bone,local,to){bone.updateMatrixWorld(true);const o=P(bone);a.copy(local).applyMatrix4(bone.matrixWorld).sub(o).normalize();b.copy(to).sub(o).normalize();
    if(a.dot(b)>0.999999)return;tq.setFromUnitVectors(a,b);bone.getWorldQuaternion(wq);bone.parent.getWorldQuaternion(pq);
    bone.quaternion.copy(pq.invert().multiply(tq.multiply(wq)));bone.updateMatrixWorld(true);}
  // ---- fit to the worn coat (hem tails, spring weights) and trousers (capsule radii); runs when the worn set changes ----
  const nk=at=>{if(!at.normalized)return 1;const ar=at.array||(at.data&&at.data.array);const C=ar.constructor;return C===Int16Array?1/32767:C===Uint16Array?1/65535:C===Int8Array?1/127:C===Uint8Array?1/255:1;};
  const visible=o=>{let p=o;while(p){if(!p.visible)return false;p=p.parent;}return true;};
  function skinned(m,cb){const g=m.geometry,Pa=g.attributes.position,SI=g.attributes.skinIndex,SW=g.attributes.skinWeight;if(!Pa||!SI||!SW)return;
    m.skeleton.update();const B=m.skeleton.boneMatrices,kp=nk(Pa),kw=nk(SW);const A=new M4().multiplyMatrices(m.matrixWorld,m.bindMatrixInverse);const v=new V(),s=new V(),t=new V(),bm=new M4();
    const ix=[0,0,0,0],w=[0,0,0,0];
    for(let i=0;i<Pa.count;i++){v.set(Pa.getX(i)*kp,Pa.getY(i)*kp,Pa.getZ(i)*kp).applyMatrix4(m.bindMatrix);s.set(0,0,0);
      ix[0]=SI.getX(i);ix[1]=SI.getY(i);ix[2]=SI.getZ(i);ix[3]=SI.getW(i);w[0]=SW.getX(i)*kw;w[1]=SW.getY(i)*kw;w[2]=SW.getZ(i)*kw;w[3]=SW.getW(i)*kw;
      const sum=w[0]+w[1]+w[2]+w[3]||1;for(let k=0;k<4;k++){if(w[k]<=0)continue;bm.fromArray(B,ix[k]*16);s.addScaledVector(t.copy(v).applyMatrix4(bm),w[k]/sum);}
      s.applyMatrix4(A);cb(i,s,ix,w,sum);}}
  let sig='',fitN=0;
  function wornSig(){const L=[];root.traverse(o=>{if(o.isSkinnedMesh&&/^(coat|cloak|pants)/.test(o.name)&&visible(o))L.push(o.uuid+":"+((o.geometry.attributes.position.data||o.geometry.attributes.position).version));});return L.join(',');}

  function bindData(m){const g=m.geometry,Pa=g.attributes.position,SI=g.attributes.skinIndex,SW=g.attributes.skinWeight;const kp=nk(Pa),kw=nk(SW);
    const names=m.skeleton.bones.map(b=>b.name),B={};m.skeleton.boneInverses.forEach((bi,j)=>{const M=bi.clone().invert();const p=new V(),q=new Q(),sc=new V();M.decompose(p,q,sc);B[names[j]]={inv:bi,p,q};});
    const each=cb=>{const v=new V(),ix=[0,0,0,0],w=[0,0,0,0];for(let i=0;i<Pa.count;i++){v.set(Pa.getX(i)*kp,Pa.getY(i)*kp,Pa.getZ(i)*kp).applyMatrix4(m.bindMatrix);
      ix[0]=SI.getX(i);ix[1]=SI.getY(i);ix[2]=SI.getZ(i);ix[3]=SI.getW(i);w[0]=SW.getX(i)*kw;w[1]=SW.getY(i)*kw;w[2]=SW.getZ(i)*kw;w[3]=SW.getW(i)*kw;cb(i,v,ix,w,(w[0]+w[1]+w[2]+w[3])||1);}};
    return {names,B,each};}
  // The trouser proxies are fitted in the BIND pose (the meshes' own bind data), so they never depend on the animation frame
  // in which the outfit changed; bind-space lengths are converted with the bone length ratio.
  function fit(){
    const coats=[],pants=[];root.traverse(o=>{if(!o.isSkinnedMesh||!visible(o))return;if(/^(coat|cloak)/.test(o.name))coats.push(o);else if(/^pants/.test(o.name))pants.push(o);});

    // weights; a chain's tail (what its middle bone aims) = the mean of the lowest third of the cloth it carries
    // the coat is measured in the current pose with the skirt at rest (its springs carry it; only ~0.2 follows the legs)
    const save=chains.map(ch=>[ch.b[0].quaternion.clone(),ch.b[1].quaternion.clone()]);restBones();
    // ...and with the thighs put back to their bind pose relative to the pelvis, so the ~0.2 thigh share of the cloth is
    // measured standing, whatever the legs were doing when the outfit changed
    const thighs=[];if(coats[0]){const sk=coats[0].skeleton,ix=n=>sk.bones.findIndex(b=>b.name===n);
      for(const n of ['L_Thigh','R_Thigh']){const b=by[n],j=ix(n),pj=b&&b.parent?ix(b.parent.name):-1;if(!b||j<0||pj<0)continue;thighs.push([b,b.position.clone(),b.quaternion.clone(),b.scale.clone()]);
        const L=sk.boneInverses[pj].clone().multiply(sk.boneInverses[j].clone().invert());L.decompose(b.position,b.quaternion,b.scale);}}
    root.updateMatrixWorld(true);
    const per=chains.map(()=>[]),cand=[];const py=P(pel).y+0.02;
    for(const m of coats){const names=m.skeleton.bones.map(x=>x.name);const kk=names.map(n=>{const r=n.match(/^skirt_(\d+)_1$/);return r?+r[1]:-1;});
      skinned(m,(i,s,ix,w,sum)=>{if(s.y>py)return;let best=-1,bw=0,tot=0;const ent=[];for(let k=0;k<4;k++){const ch=kk[ix[k]];if(ch<0||w[k]<=0)continue;const ww=w[k]/sum;tot+=ww;if(ww>=0.08)ent.push([ch,ww]);if(ww>bw){bw=ww;best=ch;}}
