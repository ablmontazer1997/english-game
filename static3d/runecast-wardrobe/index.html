<!doctype html><html lang="en"><head><!-- 10-08 TEST (admin msg 4260): no animation picker for players; the hero keeps its calm idle --><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Runecast Wardrobe</title>
<style>
/* ---- soft Runecast look: cream card, lavender/violet accents, gold highlights (light theme only, like the game's soft screens) */
:root{--bg1:#f7f0ff;--bg2:#ffeee9;--ink:#2a2550;--ink2:#6b7192;--cream:#fffdf6;--cream2:#fbf5ea;--line:#efe4cf;
  --vio:#8a4fd8;--vio2:#6f3fd0;--vioSoft:#f1e9ff;--vioInk:#5a2fb0;--gold:#f5c451;--goldDeep:#c8963a;
  --sheetH:clamp(330px,46vh,480px);--font:'Fredoka',system-ui,-apple-system,sans-serif;--game:'Fredoka',system-ui,sans-serif}
@font-face{font-family:'Fredoka';font-style:normal;font-weight:300 900;font-display:swap;src:url(fonts/Fredoka-var.woff2) format('woff2')}
input,textarea,select{font-family:inherit}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 50% 30%,var(--bg1),var(--bg2))}
#c{position:fixed;left:0;right:0;top:0;bottom:0}
#ld{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--ink2)}
html.editor #c,html.editor #ld{bottom:calc(var(--sheetH) - 14px)}
html.embed #ed,html.embed #edTop,html.embed #ld{display:none!important}html.embed body{background:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
/* top bar over the stage */
#edTop{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:max(12px,env(safe-area-inset-top)) 16px 0;pointer-events:none;z-index:3}
#edTop>*{pointer-events:auto}
.ttl{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;background:rgba(255,253,246,.82);
  box-shadow:0 4px 14px rgba(90,47,176,.12);border:1px solid rgba(239,228,207,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ttl i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:linear-gradient(145deg,#a978ff,var(--vio2));color:#fff}
.ttl b{font-family:var(--game);font-weight:800;font-size:18px;letter-spacing:.2px;line-height:1;color:var(--ink);padding-top:2px}
.acts{display:flex;gap:8px}
.ib{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 10px;border-radius:999px;border:1px solid rgba(239,228,207,.95);
  background:rgba(255,253,246,.9);color:var(--vioInk);font-weight:800;font-size:13px;box-shadow:0 4px 14px rgba(90,47,176,.12);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .15s}
.ib:active{transform:scale(.94)}
.ib.gold{background:linear-gradient(180deg,#fff6d8,#ffe7a6);border-color:#f0cf7a;color:#7a4b00}
.ib svg{width:20px;height:20px}
/* bottom sheet */
#ed{position:fixed;left:0;right:0;bottom:0;height:var(--sheetH);z-index:2;display:flex;flex-direction:column;
  background:var(--cream);border-radius:26px 26px 0 0;box-shadow:0 -12px 34px rgba(90,47,176,.14),0 -1px 0 #f3e6c8;overflow:hidden}
#ed::before{content:"";position:absolute;left:50%;top:7px;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:#e8dcc4}
#tabs{display:flex;gap:2px;overflow-x:auto;padding:16px 10px 6px;scrollbar-width:none;flex:0 0 auto;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 18px),transparent)}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;width:58px;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:2px 0;color:var(--ink2)}
.tab i{display:grid;place-items:center;width:42px;height:42px;border-radius:15px;background:var(--vioSoft);color:#7a62b0;transition:all .18s}
.tab svg{width:22px;height:22px}
.tab span{font-size:11.5px;font-weight:800;letter-spacing:.1px}
.tab.on i{background:linear-gradient(150deg,#a978ff,var(--vio2));color:#fff;box-shadow:0 5px 12px rgba(111,63,208,.35),inset 0 0 0 2px rgba(245,196,81,.55)}
.tab.on span{color:var(--vioInk)}
.rule{height:1px;margin:4px 16px 0;background:linear-gradient(90deg,transparent,#ecd9a8,transparent);flex:0 0 auto}
#pane{flex:1 1 auto;overflow-y:auto;padding:10px 16px 12px;scrollbar-width:thin;overscroll-behavior:contain}

.sec+.sec{margin-top:14px}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 8px}
.sh h3{margin:0;font-family:var(--game);font-weight:800;font-size:16px;line-height:1.1;color:var(--ink)}
.sh small{font-size:12px;font-weight:700;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px 10px}
.card{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:5px;border:0;background:none;padding:0;min-width:0}
.card .th{position:relative;aspect-ratio:1;border-radius:16px;background:radial-gradient(circle at 50% 40%,#fff 0,#f6f0ff 70%,#efe6fb 100%);
  border:1.5px solid #eee4f7;box-shadow:0 2px 6px rgba(60,40,120,.07);overflow:hidden;transition:box-shadow .15s,border-color .15s,transform .15s}
.card:active .th{transform:scale(.95)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.card img.ok{opacity:1}
.card .ic{position:absolute;inset:0;display:grid;place-items:center;color:#b7a6d8}
.card .ic svg{width:44%;height:44%}
.card img.ok+.ic{display:none}
.card .lb{font-size:12px;font-weight:800;text-align:center;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.on .th{border-color:var(--vio);box-shadow:0 0 0 2px var(--vio),0 6px 14px rgba(111,63,208,.25)}
.card.on .lb{color:var(--vioInk)}
.card .ck{position:absolute;right:-5px;top:-5px;width:22px;height:22px;border-radius:50%;display:none;place-items:center;
  background:linear-gradient(150deg,#a978ff,var(--vio2));color:#fff;border:2px solid #ffe7a6;box-shadow:0 2px 6px rgba(111,63,208,.35);z-index:1}
.card .ck svg{width:12px;height:12px}
.card.on .ck{display:grid}
.card.none .th{background:repeating-linear-gradient(45deg,#fbf7ff 0 8px,#f6f0ff 8px 16px)}
.sld{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;background:var(--cream2);border:1px solid var(--line)}
.sld span{font-size:13px;font-weight:800;color:var(--ink2);min-width:44px}
.sld input{flex:1;accent-color:var(--vio)}
/* colour strip under the grid */
#strip{flex:0 0 auto;border-top:1px solid var(--line);background:linear-gradient(180deg,#fffaf0,var(--cream2));padding:8px 0 max(10px,env(safe-area-inset-bottom))}
#strip[hidden],#ed[hidden],#edTop[hidden]{display:none}
#strip .sh{margin:0 18px 6px;justify-content:flex-start;gap:8px}
#strip .sh small::before{content:"· "}#strip .sh small:empty{display:none}
.sws{display:flex;gap:10px;overflow-x:auto;padding:4px 18px 4px;scrollbar-width:none}
.sws::-webkit-scrollbar{display:none}
.sw{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:3px solid #fff;padding:0;box-shadow:0 2px 6px rgba(60,40,120,.18);position:relative;transition:transform .15s}
.sw:active{transform:scale(.9)}
.sw.on{box-shadow:0 0 0 2.5px var(--vio),0 4px 10px rgba(111,63,208,.3)}
.sw.orig{background:conic-gradient(from 45deg,#f5c451,#e07aa3,#8a4fd8,#2f8fd8,#1f9a63,#f5c451)}
.sw.orig::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--o,#fff);border:1.5px solid #fff}
.sw:disabled{opacity:.35;cursor:default}
.hint{font-size:12px;font-weight:700;color:var(--ink2);padding:4px 18px 6px}
/* ---- boots-tabs (09-30): phones: all 9 tabs fit the bar (Pants/Shoes/Pose were off-screen with no scroll hint) */
@media (max-width:560px){#tabs{gap:0;padding:16px 4px 6px;-webkit-mask-image:none;mask-image:none}
  .tab{flex:1 1 0;width:auto;min-width:0}.tab i{width:min(42px,9.4vw);height:min(42px,9.4vw);border-radius:13px}
  .tab svg{width:20px;height:20px}.tab span{font-size:min(11.5px,2.9vw);letter-spacing:0}}
/* ---- /boots-tabs */
/* ---- 10-08 (admin msg 4269): tabs at the bottom; the colour swatches are one scrolling row with the Done button beside it */
#pane{order:1;padding-top:20px}
#bar{order:2;flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:58px;padding:6px 14px 6px 0;
  border-top:1px solid var(--line);background:linear-gradient(180deg,#fffaf0,var(--cream2))}
#tabs{order:3;padding:8px 4px max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--cream);
  -webkit-mask-image:none;mask-image:none}
#strip{flex:1 1 auto;min-width:0;border-top:0;background:none;padding:0}
#strip .sh{margin:0 0 4px 16px}
#strip .sh h3{font-size:13.5px}
#strip .sws{padding:3px 8px 4px 16px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent)}
#strip .hint{padding:2px 8px 2px 16px}
#strip[hidden]+#btnDone{margin-left:auto}
#btnDone{display:none;flex:0 0 auto;height:44px;padding:0 22px 2px;border:0;border-radius:999px;color:#fff;
  font-family:var(--game);font-weight:800;font-size:16px;letter-spacing:.2px;line-height:1;
  background:linear-gradient(180deg,#a978ff,var(--vio2));box-shadow:0 4px 0 #5427a8,0 8px 16px rgba(90,47,176,.3),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .12s}
#btnDone:active{transform:translateY(2px);box-shadow:0 2px 0 #5427a8,0 4px 10px rgba(90,47,176,.3)}
html.inapp #btnDone{display:block}
html:not(.inapp) #bar:has(#strip[hidden]){display:none}
.eyegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:12px 8px}
.ecol{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0;min-width:0}
.ecol .ir{width:52px;height:52px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(60,40,120,.18);
  background:radial-gradient(circle at 50% 50%,#1d1530 0 22%,var(--c) 24% 62%,color-mix(in srgb,var(--c) 60%,#000) 64% 100%);position:relative;transition:transform .15s}
.ecol .ir::after{content:"";position:absolute;left:24%;top:20%;width:22%;height:22%;border-radius:50%;background:#fff;opacity:.9}
.ecol:active .ir{transform:scale(.92)}
.ecol .lb{font-size:12px;font-weight:800;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ecol.on .ir{box-shadow:0 0 0 2.5px var(--vio),0 6px 14px rgba(111,63,208,.3)}
.ecol.on .lb{color:var(--vioInk)}
@media (max-width:560px){#tabs{padding:8px 4px max(8px,env(safe-area-inset-bottom))}}

/* wide screens: the sheet becomes a side panel */
@media (min-width:820px) and (min-aspect-ratio:1/1){
  #ed{left:auto;right:18px;top:18px;bottom:18px;height:auto;width:400px;border-radius:26px}
  html.editor #c,html.editor #ld{bottom:0;right:436px}
  #edTop{right:436px}
}
.sec .sh .wbk{margin-left:auto;border:0;border-radius:999px;padding:4px 12px;font:inherit;font-size:12px;font-weight:700;background:#efe8ff;color:#5a3aa0;cursor:pointer}
</style>
<style id="ui2">
/* ==== ES2 wardrobe (admin 5320 / concept C approved msg 5334, 10-13): the cleaned profile stage backdrop (no rays), the
   GPT pieces in ui2/ (pedestal, painted tab tiles, two-part item cards, violet equipped check, swatch ring) + the app kit
   (gold ribbon, cream / green buttons, cream panel). Editor only: ?embed=1 (map / battle / thumbs) is untouched. ==== */
html.editor{--sheetH:clamp(330px,45vh,470px)}
html.editor.inapp{--sheetH:clamp(350px,47vh,490px)}
html.editor body{background:#4b2aa0 url(ui2/bg.webp) center top/cover no-repeat}
/* top bar: gold ribbon title, cream kit buttons */
html.editor #edTop{padding:max(10px,env(safe-area-inset-top)) 10px 0}
html.editor .ttl{width:min(46vw,190px);height:auto;aspect-ratio:379/104;justify-content:center;padding:0 0 7% 0;border:0;border-radius:0;box-shadow:none;
  background:url(ui2/ribbon_gold.webp) center/100% 100% no-repeat;backdrop-filter:none;-webkit-backdrop-filter:none;filter:drop-shadow(0 3px 5px rgba(40,10,90,.35))}
html.editor .ttl i{display:none}
html.editor .ttl b{font-size:clamp(17px,4.8vw,21px);font-weight:800;color:#5a3204;text-shadow:0 1px 0 rgba(255,246,200,.85)}
html.editor .acts{gap:6px}
html.editor .ib,html.editor .ib.gold{height:44px;padding:0 14px 3px 10px;border:0 solid transparent;border-radius:0;background:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;
  border-image:url(ui2/btn_cream.webp) 43 38 42 42 fill/16px 14px 16px 15px stretch;color:#4a2590;font-size:13.5px;filter:drop-shadow(0 3px 5px rgba(40,10,90,.3))}
html.editor .ib:active{border-image-source:url(ui2/btn_cream_pressed.webp);transform:none}
html.editor .ib svg{width:18px;height:18px;color:#6d2fe6}
/* the bottom sheet: the kit's cream panel with its gold rim (no bottom rim, it runs off the screen) */
html.editor #ed{border-radius:0;background:none;box-shadow:none;overflow:visible;border:0 solid transparent;
  border-image:url(ui2/panel_cream.webp) 38 30 37 41 fill/19px 15px 0 20px stretch;filter:drop-shadow(0 -6px 14px rgba(30,8,80,.35))}
html.editor #ed::before{top:9px;background:#e2cf9f;z-index:1}
/* order like the concept: tabs, colours, items, Save look */
html.editor #tabs{order:0;padding:20px 8px 4px;border-top:0;background:none;overflow:visible}
html.editor #bar{display:contents}
html.editor #strip{order:1;flex:0 0 auto;padding:4px 0 2px}
html.editor #pane{order:2;padding:8px 14px 10px}
html.editor #btnDone{order:3}
/* tabs: the painted violet tiles; the open tab lifts with a gold glow */
html.editor .tab{gap:3px;color:#4a2590}
html.editor .tab i{width:min(46px,10.2vw);height:min(46px,10.2vw);border-radius:0;background:center/contain no-repeat;box-shadow:none;transition:transform .18s,filter .18s}
html.editor .tab i svg{display:none}
html.editor .tab[data-t=body] i{background-image:url(ui2/tab_body.webp)}html.editor .tab[data-t=eyes] i{background-image:url(ui2/tab_eyes.webp)}
html.editor .tab[data-t=hair] i{background-image:url(ui2/tab_hair.webp)}html.editor .tab[data-t=hat] i{background-image:url(ui2/tab_hat.webp)}
html.editor .tab[data-t=top] i{background-image:url(ui2/tab_top.webp)}html.editor .tab[data-t=coat] i{background-image:url(ui2/tab_coat.webp)}
html.editor .tab[data-t=pants] i{background-image:url(ui2/tab_pants.webp)}html.editor .tab[data-t=shoes] i{background-image:url(ui2/tab_shoes.webp)}html.editor .tab[data-t=wand] i{background-image:url(ui2/tab_wand.webp?v=1)}
html.editor .tab:not(.on) i{filter:saturate(.8) brightness(.97)}
html.editor .tab.on i{background-color:transparent;box-shadow:none;transform:translateY(-3px) scale(1.06);filter:drop-shadow(0 0 4px rgba(255,214,90,1)) drop-shadow(0 0 9px rgba(255,190,60,.7))}
html.editor .tab span{font-size:min(12px,3vw);font-weight:800;color:#4a2590}
html.editor .tab.on span{color:#2a1f5c}
/* colour row: a cream strip with gold-ring swatches */
html.editor #strip .sh{margin:0 0 3px 16px}
html.editor #strip .sh h3{font-size:14px;color:#2a1f5c}
html.editor #strip .sws{gap:9px;padding:4px 12px 6px 16px}
html.editor .sw{width:36px;height:36px;border:0;box-shadow:inset 0 -5px 8px rgba(0,0,0,.18),inset 0 4px 6px rgba(255,255,255,.45)}
html.editor .sw::before{content:"";position:absolute;inset:-4px;background:url(ui2/ring.webp) center/100% 100% no-repeat;pointer-events:none}
html.editor .sw.on{box-shadow:inset 0 -5px 8px rgba(0,0,0,.18),inset 0 4px 6px rgba(255,255,255,.45);transform:scale(1.12);filter:drop-shadow(0 0 5px rgba(255,205,70,1))}
html.editor .sw.orig::after{inset:7px}
/* item cards: the painted two-part card (lavender top, cream name strip); the item stands on the gold plate */
html.editor .grid{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px 7px}
html.editor .card{gap:0;border:0 solid transparent;border-image:url(ui2/card.webp) 40 40 100 40 fill/16px 16px 40px 16px stretch;filter:drop-shadow(0 4px 6px rgba(40,20,100,.18))}
html.editor .card .th{aspect-ratio:1;margin:0;border:0;border-radius:0;background:url(ui2/plate.webp) center 92%/70% auto no-repeat;box-shadow:none;overflow:visible}
html.editor .card img{inset:2% 8% 12%;width:84%;height:86%;object-fit:contain}
html.editor .card .ic{color:#9b86cf}
html.editor .card .lb{display:block;height:40px;padding:0 7px 5px;line-height:35px;font-size:12px;font-weight:800;color:#2a1f5c;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.editor .card.on{border-image-source:url(ui2/card_on.webp);filter:drop-shadow(0 0 6px rgba(150,90,255,.85))}
html.editor .card.on .th{border:0;box-shadow:none}
html.editor .card.on .lb{color:#4a2590}
html.editor .card .ck{right:-8px;top:-8px;width:28px;height:28px;border:0;border-radius:0;box-shadow:none;background:url(ui2/check.webp) center/contain no-repeat}
html.editor .card .ck svg{display:none}
html.editor .card.none .th{background:url(ui2/plate.webp) center 92%/70% auto no-repeat}
html.editor .card.own-lk{border-image-source:url(ui2/card_lk.webp)}
html.editor .card.own-lk.on{border-image-source:url(ui2/card_on.webp)}
/* price / earn chips: buyable = small green kit chip, earned / premium = cream chip with the painted padlock */
html.editor .card .own-pc{bottom:36px;height:24px;padding:0 9px 2px;border-radius:0;box-shadow:none;background:none;font-size:12px;color:#fff;text-shadow:0 1px 0 rgba(20,80,10,.6);
  border:0 solid transparent;border-image:url(ui2/btn_green.webp) 43 45 44 48 fill/12px 12px 12px 13px stretch}
html.editor .card .own-pc.own-boss,html.editor .card .own-pc.own-earned,html.editor .card .own-pc.own-premium{color:#4a2590;text-shadow:none;
  border-image:url(ui2/btn_cream.webp) 43 38 42 42 fill/12px 11px 12px 11px stretch}
html.editor .card .own-pc svg{color:#b07c22}
html.editor .card .own-pc.own-boss svg,html.editor .card .own-pc.own-earned svg,html.editor .card .own-pc.own-premium svg{display:none}
html.editor .card .own-pc.own-boss::before,html.editor .card .own-pc.own-earned::before,html.editor .card .own-pc.own-premium::before{content:"";width:12px;height:15px;margin-right:4px;background:url(ui2/padlock.webp) center/contain no-repeat}
/* sliders and the eye colours keep their look on the cream panel */
html.editor .sld{background:#fbf3e3;border-color:#ecd9a8}
/* Save look: the green kit button, clear of the grid */
html.editor #btnDone{height:auto;min-height:50px;margin:2px 16px max(8px,env(safe-area-inset-bottom));padding:4px 22px 8px;border:0 solid transparent;border-radius:0;background:none;box-shadow:none;
  border-image:url(ui2/btn_green.webp) 43 45 44 48 fill/22px 22px 22px 24px stretch;font-size:21px;text-shadow:0 2px 0 rgba(20,90,10,.55);filter:drop-shadow(0 4px 6px rgba(20,60,10,.25))}
html.editor #strip[hidden]+#btnDone{margin-left:16px}
/* ui3: colour rows stay inside the cream panel (the gold frame no longer cuts the last swatch); a deliberate scroller with a fade */
html.editor #strip .sws{margin:0 16px 0 18px;padding:5px 26px 7px 4px;gap:8px;scroll-snap-type:x proximity;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 6px,#000 calc(100% - 34px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 6px,#000 calc(100% - 34px),transparent)}
html.editor #strip .sw{flex:0 0 auto;scroll-snap-align:start}
html.editor #strip .sh{margin-left:20px}
/* ui3: small phones in the app: the sheet grows so the first card row (thumb + name) sits fully above Save look */
@media (max-width:400px) and (max-height:800px){html.editor{--sheetH:clamp(346px,47vh,470px)}html.editor.inapp{--sheetH:clamp(402px,55vh,490px)}}
/* ui3: close X (concept C), standalone page only: in the app Save look closes the wardrobe */
#btnX{display:none}
html.editor:not(.inapp) #btnX{display:flex;justify-content:center;flex:0 0 auto;width:44px;padding:0 0 3px}
html.editor #btnX svg{width:20px;height:20px;color:#6d2fe6}
@media (max-width:440px){html.editor:not(.inapp) #edTop .ttl{width:min(36vw,150px)}html.editor:not(.inapp) #edTop .ttl b{font-size:clamp(15px,4.2vw,18px)}
