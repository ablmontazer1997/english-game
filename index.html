<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2b1166" />
    <title>English Spell</title>
    <!-- admin 6041: startup splash. Shown by this static HTML at once (before the JS bundle), then the same markup is
         rendered by React's <Splash/> (src/components/Splash.tsx) while the game loads, so the two look identical. -->
    <link rel="preload" as="image" href="/runecast/splash/splash.webp" />
    <link rel="preload" as="font" type="font/woff2" href="/runecast/fonts/Fredoka-var.woff2" crossorigin />
    <style>
      @font-face { font-family: "Fredoka"; font-style: normal; font-weight: 300 700; font-display: swap; src: url("/runecast/fonts/Fredoka-var.woff2") format("woff2"); }
      html, body { background: #2b1166; }
      .es-splash { position: fixed; inset: 0; z-index: 50; overflow: hidden; background: #2b1166; font-family: Fredoka, system-ui, sans-serif;
        --st: var(--safe-top, env(safe-area-inset-top, 0px)); --sb: var(--safe-bottom, env(safe-area-inset-bottom, 0px)); }
      /* admin 6264 fix (10-21): the 20 s total cap must not depend on the JS thread (a loading 3D hero in the same-origin
         iframe can block it for many seconds on a slow phone). An opacity animation on its own layer runs on the compositor
         thread, so the boot splash fades at 20 s from its first paint even when JS is busy; bootSplash.ts removes it later.
         Only the static boot splash (es-sp-boot), never the React loading Splash. */
      .es-sp-boot { will-change: opacity; animation: es-sp-cap .25s linear 20s forwards, es-sp-off 1ms linear 20.25s forwards; }
      @keyframes es-sp-cap { to { opacity: 0; } }   /* opacity only: compositor thread */
      @keyframes es-sp-off { to { visibility: hidden; pointer-events: none; } }   /* main thread, once it is free */
      .es-sp-art { position: absolute; inset: 0; background: url("/runecast/splash/splash.webp") 15% 40% / cover no-repeat; }
      .es-sp-art::after { content: ""; position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(20,6,52,.45) 0%, rgba(20,6,52,0) 22%, rgba(20,6,52,0) 72%, rgba(20,6,52,.75) 100%); }
      .es-sp-title { position: absolute; left: 50%; top: calc(var(--st) + max(22px, 4.5vh)); transform: translateX(-50%); width: min(86vw, 380px);
        display: grid; place-items: center; filter: drop-shadow(0 6px 18px rgba(255, 190, 80, .45)); }
      .es-sp-title img { width: 100%; height: auto; display: block; }
      .es-sp-title span { position: absolute; top: 21%; font-weight: 700; font-size: min(10.2vw, 45px); color: #fff; white-space: nowrap; letter-spacing: .005em;
        text-shadow: -3px -3px 0 #8a4b0c, 3px -3px 0 #8a4b0c, -3px 3px 0 #8a4b0c, 3px 3px 0 #8a4b0c, 0 -3px 0 #8a4b0c, 0 3px 0 #8a4b0c, -3px 0 0 #8a4b0c, 3px 0 0 #8a4b0c, 0 5px 0 #8a4b0c, 0 8px 10px rgba(90, 50, 0, .45); }
      .es-sp-load { position: absolute; left: 0; right: 0; bottom: calc(var(--sb) + max(24px, 3.5vh)); display: grid; justify-items: center; gap: 8px; padding: 0 24px; text-align: center; }
      .es-sp-ring { position: relative; width: 58px; height: 58px; border-radius: 50%; margin-bottom: 4px;
        box-shadow: 0 0 22px 6px rgba(255, 190, 80, .35), inset 0 0 0 3px rgba(255, 255, 255, .18); }
      .es-sp-ring::before { content: ""; position: absolute; inset: 0; border-radius: 50%; padding: 4px;
        background: conic-gradient(from 0deg, rgba(255, 214, 110, 0) 0deg, #ffd66e 220deg, #fff4cf 260deg, rgba(255, 214, 110, 0) 261deg);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
        animation: es-sp-spin 1.1s linear infinite; }
      .es-sp-ring::after { content: "✦"; position: absolute; inset: 0; display: grid; place-items: center; color: #ffe7a8; font-size: 22px;
        text-shadow: 0 0 10px #ffc04d; animation: es-sp-pulse 1.4s ease-in-out infinite; }
      .es-sp-load b { font-weight: 700; font-size: 16px; color: #fff0c8; text-shadow: 0 2px 0 #2a0b5e, 0 0 10px rgba(30, 8, 70, .8); letter-spacing: .01em; }
      .es-sp-tip { margin: 0; max-width: 320px; min-height: 2.6em; font-weight: 600; font-size: 13.5px; line-height: 1.3; color: #e6dcff;
        text-shadow: 0 1px 2px rgba(20, 6, 52, .9); transition: opacity .35s; }
      .es-sp-bar { width: min(220px, 58vw); height: 6px; border-radius: 3px; overflow: hidden; background: rgba(20, 6, 52, .55);
        box-shadow: 0 0 0 1px rgba(255, 214, 110, .35), 0 0 10px rgba(255, 190, 80, .25); }
      .es-sp-bar i { display: block; height: 100%; transform-origin: 0 50%; transform: scaleX(.04); border-radius: 3px;
        background: linear-gradient(90deg, #ffb84d, #ffd66e 60%, #fff4cf); }
      @keyframes es-sp-spin { to { transform: rotate(360deg); } }
      @keyframes es-sp-pulse { 50% { transform: scale(1.18); opacity: .75; } }
      @media (prefers-reduced-motion: reduce) { .es-sp-ring::before { animation-duration: 3s; } .es-sp-ring::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="es-splash es-sp-boot" role="img" aria-label="English Spell is loading">
      <div class="es-sp-art"></div>
      <div class="es-sp-title"><img src="/runecast/splash/ribbon.webp" alt="" draggable="false" /><span>English Spell</span></div>
      <div class="es-sp-load"><div class="es-sp-ring"></div><b>Opening the portal…</b><div class="es-sp-bar"><i id="es-sp-bar"></i></div><p class="es-sp-tip" id="es-sp-tip">Tip: say new words out loud.</p></div>
    </div></div>
    <script>
      // tips rotate in the static splash; React's <Splash/> takes over with the same list when the bundle runs
      (function () { var T = window.ES_TIPS = ["Tip: say new words out loud.", "Tip: read the whole sentence first.", "Tip: a little every day helps.", "Tip: mistakes help you learn.", "Tip: use a new word today.", "Tip: listen, then say it again."];
        var i = 0, el = document.getElementById('es-sp-tip'), t = setInterval(function () { if (!el.isConnected) return clearInterval(t); el.style.opacity = 0;
          setTimeout(function () { i = (i + 1) % T.length; el.textContent = T[i]; el.style.opacity = 1; window.ES_TIP_I = i }, 350) }, 3200) })();
      // admin 6264: the bar moves from the first paint; bootSplash.ts takes it over with real milestones
      (function () { var b = document.getElementById('es-sp-bar'), p = 0.04, t = setInterval(function () { if (!b.isConnected || b.dataset.own) return clearInterval(t);
          p += (0.13 - p) * 0.05; b.dataset.p = p; b.style.transform = 'scaleX(' + p.toFixed(4) + ')' }, 100) })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
